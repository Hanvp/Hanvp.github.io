
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>진호와 예지의 이야기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: black;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      max-height: 100dvh;
      object-fit: contain;
    }

    #playButton {
      position: absolute;
      padding: 18px 28px;
      border: none;
      border-radius: 40px;
      background: rgba(255,255,255,.95);
      color: #222;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <video id="video" playsinline preload="metadata">
    <source
      src="./장진호_김예지_식전영상v1.0.mp4"
      type="video/mp4">
  </video>

  <button id="playButton">
    ▶ 진호와 예지의 이야기 시작하기
  </button>

  <script>
    const video = document.getElementById("video");
    const button = document.getElementById("playButton");

    button.addEventListener("click", async () => {
      try {
        await video.play();
        video.controls = true;
        button.style.display = "none";
      } catch (error) {
        video.controls = true;
        console.error(error);
      }
    });
  </script>
</body>
</html>
