
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Our Story</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    #player {
      width: 100%;
      max-height: 100dvh;
      object-fit: contain;
    }

    #start {
      position: absolute;
      padding: 18px 28px;
      background: rgba(255,255,255,.92);
      border: none;
      border-radius: 40px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <video id="player" playsinline preload="metadata">
    <source src="/KakaoTalk_20261107_234207590.mp4" type="video/mp4">
  </video>

  <button id="start">▶ 우리의 이야기 시작하기</button>

  <script>
    const video = document.getElementById("player");
    const button = document.getElementById("start");

    button.addEventListener("click", async () => {
      try {
        await video.play();
        button.style.display = "none";
        video.controls = true;
      } catch (error) {
        video.controls = true;
        console.error("재생 실패:", error);
      }
    });
  </script>
</body>
</html>
